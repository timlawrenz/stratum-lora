pretrained_model_name_or_path = "stabilityai/stable-diffusion-xl-base-1.0"
output_dir = "/mnt/nas-ai-models/loras/sdxl/grid_search/control_dim64"
output_name = "scarl3tt_control_dim64"

train_data_dir = "/mnt/nas-ai-models/training-data/loras/scarl3tt"

network_module = "networks.lora"
network_dim = 64
network_alpha = 32
network_train_unet_only = true

resolution = "512,512"
batch_size = 1
max_train_steps = 3000
save_every_n_steps = 1000
save_precision = "fp16"

optimizer_type = "AdamW"
learning_rate = 1e-4

min_snr_gamma = 5.0

# ── AuraFace Identity Loss ──
auraface_lambda = 0.0
auraface_data_dir = "/mnt/nas-ai-models/training-data/loras/scarl3tt"
auraface_threshold = 0.3
arcface_weights = "/mnt/nas-ai-models/checkpoints/InsightFace_Pytorch+model_ir_se50.pth"

# ROCm-safe settings
mixed_precision = "no"
cache_latents = false
cache_latents_to_disk = false
enable_bucket = true
bucket_reso_steps = 64
bucket_no_upscale = true

lowram = false
vae_batch_size = 1
no_half_vae = true
