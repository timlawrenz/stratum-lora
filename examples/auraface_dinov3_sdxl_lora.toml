# AuraFace + DINOv3 — SDXL LoRA with full identity pipeline
# Phase 1 (identity loss) + Phase 2 (DINOv3 CLS conditioning)
#
# Usage:
#   python sdxl_train_network.py --config_file examples/auraface_dinov3_sdxl_lora.toml

pretrained_model_name_or_path = "stabilityai/stable-diffusion-xl-base-1.0"
output_dir = "./output/dinov3_lora"
output_name = "persona_dinov3"

train_data_dir = "./data/my_person"

network_module = "networks.lora"
network_dim = 32
network_alpha = 16
network_train_unet_only = true

resolution = "512,512"
batch_size = 1
max_train_steps = 400
save_every_n_epochs = 100
save_precision = "fp16"

optimizer_type = "AdamW"
learning_rate = 1e-4

min_snr_gamma = 5.0

# ── Phase 1: AuraFace Identity Loss ──
auraface_lambda = 0.1
auraface_data_dir = "./data/my_person"
auraface_threshold = 0.3
arcface_weights = "/mnt/nas-ai-models/checkpoints/InsightFace_Pytorch+model_ir_se50.pth"

# ── Phase 2: DINOv3 Identity Conditioning ──
# Run tools/compute_dinov3_token.py first
dinov3_token = "./data/my_person/dinov3_cls.npy"
dinov3_dropout = 0.2

# ROCm-safe settings
mixed_precision = "no"
cache_latents = false
cache_latents_to_disk = false
enable_bucket = true
bucket_reso_steps = 64
bucket_no_upscale = true

lowram = false
vae_batch_size = 1
no_half_vae = true
