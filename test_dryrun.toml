# Minimal dry-run config for debugging AuraFace pipeline
# Uses batch_size=1, only 5 steps, no saving
# Run: python train_network.py --config_file test_dryrun.toml

pretrained_model_name_or_path = "stabilityai/stable-diffusion-xl-base-1.0"
output_dir = "./output/test_dryrun"
output_name = "test"

train_data_dir = "/mnt/nas-ai-models/training-data/loras/hegre-moloko"

network_module = "networks.lora"
network_dim = 4
network_alpha = 1
network_train_unet_only = true

resolution = "512,512"
batch_size = 1
max_train_steps = 5
save_every_n_epochs = 100
save_precision = "fp16"

optimizer_type = "AdamW8bit"
learning_rate = 1e-4

min_snr_gamma = 5.0

# AuraFace
auraface_lambda = 0.1
auraface_data_dir = "/mnt/nas-ai-models/training-data/loras/hegre-moloko"
auraface_threshold = 0.3
arcface_weights = "/mnt/nas-ai-models/checkpoints/InsightFace_Pytorch+model_ir_se50.pth"

mixed_precision = "fp16"
cache_latents = true
cache_latents_to_disk = true

# Memory saving
lowram = true
vae_batch_size = 1
no_half_vae = false
